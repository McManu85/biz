<!DOCTYPE html>
<html lang="zh-CN" data-lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>穆鲁阿项目 · McVeras</title>
<meta name="theme-color" content="#16241F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --stone:#E6E7E0; --ink:#16241F; --ink-soft:#3E4E47;
  --pine:#1F3A31; --brass:#B8862B; --sage:#5F8A6E; --clay:#7E3B2A;
  --line:rgba(22,36,31,.14);
  --display:'Bricolage Grotesque','Noto Sans SC','Helvetica Neue',Arial,sans-serif;
  --body:'IBM Plex Sans','Noto Sans SC','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono','Noto Sans SC','SF Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--stone);color:var(--ink);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding-bottom:24px}
[data-lang="zh"] body{line-height:1.75}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}

/* ---------- selector de idioma ---------- */
.langbar{background:#0F1D17;padding:9px 0}
.langbar .wrap{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.langswitch{display:inline-flex;background:rgba(230,231,224,.08);border-radius:20px;padding:3px}
.langswitch button{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;padding:5px 14px;border-radius:16px;
  border:none;background:none;color:rgba(230,231,224,.55);cursor:pointer;-webkit-tap-highlight-color:transparent;
  transition:background .15s,color .15s;
}
.langswitch button[aria-pressed="true"]{background:var(--brass);color:var(--pine);font-weight:600}
.langswitch button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

header{background:var(--pine);color:var(--stone);padding:26px 0;position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,var(--brass),transparent)}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:16px}
.brand svg{width:38px;height:auto;flex:none;color:var(--brass)}
.brand-txt{font-family:var(--display);font-size:14px;font-weight:700;line-height:1.05}
.brand-txt span{display:block;font-family:var(--mono),var(--body);font-size:8.5px;font-weight:400;letter-spacing:.1em;text-transform:none;color:var(--brass);margin-top:3px}
h1{font-family:var(--display);font-size:clamp(26px,7.5vw,32px);line-height:1.15;font-weight:800;letter-spacing:-.005em}
h1 em{font-style:normal;display:block;color:var(--brass);font-size:.68em;margin-top:5px;font-weight:700}
.sub{margin-top:12px;font-size:14.5px;color:rgba(230,231,224,.78);max-width:38ch}

section{padding:28px 0 4px}
.num{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--brass);margin-bottom:7px}
[data-lang="zh"] .num{letter-spacing:.05em}
h2{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.005em;line-height:1.25;margin-bottom:11px}
p{font-size:15px;margin-bottom:11px;color:var(--ink-soft)}
p strong{color:var(--ink);font-weight:600}
.rule{height:1px;background:var(--line);margin:26px 0 0}

/* ---------- calculadora ---------- */
.calc{background:var(--pine);color:var(--stone);border-radius:5px;padding:22px 18px;margin-top:4px}
.field{margin-bottom:20px}
.field:last-of-type{margin-bottom:0}
.field-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px}
.field-lab{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:rgba(230,231,224,.6)}
.field-val{font-family:var(--display);font-size:22px;font-weight:800;color:var(--brass);letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:transparent;display:block}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:rgba(230,231,224,.22)}
input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:rgba(230,231,224,.22)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--brass);border:3px solid var(--pine);margin-top:-11px;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--brass);border:3px solid var(--pine);cursor:pointer}
input[type=range]:focus-visible{outline:2px solid var(--brass);outline-offset:4px;border-radius:4px}
.scale{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:rgba(230,231,224,.48);margin-top:5px}

.readout{border-top:1px solid rgba(230,231,224,.16);padding-top:17px;margin-top:4px}
.rows{width:100%;border-collapse:collapse}
.rows td{padding:9px 0;border-bottom:1px solid rgba(230,231,224,.13);font-size:13.5px}
.rows td:first-child{color:rgba(230,231,224,.75);padding-right:10px}
.rows td:last-child{text-align:right;font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.rows tr.hi td{border-bottom:none;padding-top:12px}
.rows tr.hi td:first-child{font-family:var(--display);font-size:15px;font-weight:700;color:var(--stone)}
.rows tr.hi td:last-child{font-family:var(--display);font-size:26px;font-weight:800;color:var(--brass)}
.rows tr.pct td:last-child{color:var(--brass);font-size:15px;font-weight:600}

.flag{margin-top:14px;font-size:12.5px;line-height:1.6;padding:10px 12px;border-radius:3px;background:rgba(95,138,110,.2);border-left:2px solid var(--sage);color:rgba(230,231,224,.9)}
.flag.warn{background:rgba(126,59,42,.28);border-left-color:#E08A72}
.flag b{font-weight:600;color:var(--stone)}

.anual{margin-top:16px}
.anual-lab{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:rgba(230,231,224,.5);margin-bottom:8px;line-height:1.5}
.anual-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(230,231,224,.15);border:1px solid rgba(230,231,224,.15);border-radius:3px;overflow:hidden}
.acell{background:var(--pine);padding:10px 8px;text-align:center}
.acell dt{font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;color:rgba(230,231,224,.5);margin-bottom:5px}
.acell dd{font-family:var(--display);font-size:16px;font-weight:700;color:var(--stone);font-variant-numeric:tabular-nums}
.anual-note{margin-top:9px;font-size:11.5px;color:rgba(230,231,224,.55);line-height:1.55}

.quote{margin-top:16px;font-size:13.5px;line-height:1.65;color:var(--ink-soft);border-left:2px solid var(--brass);padding-left:12px}
.quote b{color:var(--ink)}

footer{margin-top:30px;padding:22px 0 4px;border-top:1px solid var(--line)}
footer p{font-family:var(--mono);font-size:11px;color:var(--ink-soft);line-height:1.7}
</style>
</head>
<body>

<div class="langbar">
  <div class="wrap">
    <div class="langswitch" role="group" aria-label="Language / 语言">
      <button type="button" id="btnZh" aria-pressed="true">中文</button>
      <button type="button" id="btnEs" aria-pressed="false">ES</button>
    </div>
  </div>
</div>

<header>
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 430 258" role="img" aria-label="McVeras" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 110 L140 6 L272 110"/>
        <path d="M158 110 L292 6 L424 110"/>
        <path d="M6 110 V250 H66"/>
        <path d="M424 110 V250 H364"/>
        <path d="M158 110 V250 H272 V110"/>
        <path d="M64 186 V152 A13 13 0 0 1 90 152 V186 M90 152 A13 13 0 0 1 116 152 V186"/>
        <path d="M330 142 L354 187 L378 142"/>
      </svg>
      <div class="brand-txt">McVeras<span id="brandSub"></span></div>
    </div>
    <h1 id="titleBlock"><span id="titleMain"></span><em id="titleEm"></em></h1>
    <p class="sub" id="heroSub"></p>
  </div>
</header>

<main class="wrap">

<section id="op">
  <div class="num" id="s1num"></div>
  <h2 id="s1h2"></h2>
  <p id="s1p"></p>
  <div class="rule"></div>
</section>

<section id="reparto">
  <div class="num" id="s2num"></div>
  <h2 id="s2h2"></h2>
  <p id="s2p1"></p>
  <p id="s2p2"></p>
  <div class="rule"></div>
</section>

<section id="calc-section">
  <div class="num" id="s3num"></div>
  <h2 id="s3h2"></h2>
  <p id="s3p"></p>

  <div class="calc">
    <div class="field">
      <div class="field-head">
        <span class="field-lab" id="apLab"></span>
        <span class="field-val" id="apVal">40.000 €</span>
      </div>
      <input type="range" id="apSlider" min="10000" max="80000" step="1000" value="40000">
      <div class="scale"><span>10.000</span><span>80.000</span></div>
    </div>

    <div class="field">
      <div class="field-head">
        <span class="field-lab" id="pLab"></span>
        <span class="field-val" id="pVal">160.000 €</span>
      </div>
      <input type="range" id="pSlider" min="80000" max="200000" step="1000" value="160000">
      <div class="scale"><span>80.000</span><span>140.000</span><span>200.000</span></div>
    </div>

    <div class="readout">
      <table class="rows">
        <tr><td id="rowPuestoLab"></td><td id="rowPuesto">40.000 €</td></tr>
        <tr><td id="rowBeneficioLab"></td><td id="rowBeneficio">21.856 €</td></tr>
        <tr class="pct"><td id="rowPctLab"></td><td id="rowPct">54,6 %</td></tr>
        <tr class="hi"><td id="rowTotalLab"></td><td id="rowTotal">61.856 €</td></tr>
      </table>
      <div class="flag" id="flag"></div>
    </div>

    <div class="anual">
      <div class="anual-lab" id="anualLab"></div>
      <div class="anual-grid">
        <div class="acell"><dt id="a6Lab"></dt><dd id="a6">139,1 %</dd></div>
        <div class="acell"><dt id="a12Lab"></dt><dd id="a12">54,6 %</dd></div>
        <div class="acell"><dt id="a18Lab"></dt><dd id="a18">33,7 %</dd></div>
      </div>
      <p class="anual-note" id="anualNote"></p>
    </div>
  </div>

  <p class="quote" id="quoteText"></p>
</section>

<footer>
  <p id="footerText"></p>
</footer>

</main>

<script>
(function(){
  "use strict";

  var LANG = {
    zh: {
      brandSub: "资产控股公司 · 阿拉瓦",
      titleMain: "穆鲁阿项目",
      titleEm: "了解您的投资",
      heroSub: "以下为您详细说明:您的资金将如何使用,以及最终能拿回多少。",

      s1num: "01 · 项目简介",
      s1h2: "购买、翻新、出售",
      s1p: "McVeras 通过司法拍卖购得穆鲁阿(Murua)的一套住宅。项目非常简单:<strong>购买房产、进行轻度翻新,然后出售</strong>。",

      s2num: "02 · 所需资金与分配方式",
      s2h2: "投资者共同出资 8 万欧元",
      s2p1: "投资者共同约定的出资总额为 <strong>80,000 欧元</strong>。我们预计房屋售价约为 <strong>160,000 欧元</strong>,若市场行情理想,甚至可能达到 189,000 欧元。出售后,首先归还全部投资本金,剩余利润按以下比例分配:<strong>34% 归 McVeras</strong>(负责整个项目的运营管理),<strong>66% 按各投资者的出资比例分配</strong>。",
      s2p2: "如果实际所需资金超出预期,超出部分由 <strong>McVeras</strong> 自行垫付,不会向投资者额外募资。投资者的出资总额始终保持在约定的 <strong>80,000 欧元</strong>。",

      s3num: "03 · 您能拿到多少",
      s3h2: "拖动滑块,实时查看结果",
      s3p: "调整您的出资额和预计售价,系统会立即为您重新计算。",

      apLab: "您的出资额",
      pLab: "预计售价",

      rowPuestoLab: "收回本金",
      rowBeneficioLab: "加上您的利润分成",
      rowPctLab: "毛收益率",
      rowTotalLab: "您最终拿到的总额",

      flagOkTitle: "已超过盈亏平衡点。",
      flagOkText: "您将全额收回本金,并获得相应的利润分成。",
      flagWarnTitle: "低于盈亏平衡点。",
      flagWarnText: function(total, ap){
        return "您将收回约 " + total + " 欧元,而非投入的 " + ap + " 欧元。亏损金额不会超过您的出资额。";
      },

      anualLab: "年化收益率(按出售所需时间计算)",
      a6Lab: "6 个月", a12Lab: "12 个月", a18Lab: "18 个月",
      anualNote: "如果提前成交,同样的收益换算成年化会更高;如果拖得更久,年化收益会相应降低。实际赚到的钱不会变——变化的只是这笔钱工作了多长时间。",

      quoteText: "您在利润中的占比,取决于您的出资比例:<b>66% × (您的出资 ÷ 80,000 欧元)</b>。出资多少会改变您的占比,但每一欧元带来的收益率始终相同。",

      footerText: "McVeras S.L. · 税号 B05393699 · 西班牙 维多利亚-加斯特斯（Vitoria-Gasteiz）— 说明性文件。以上数字均为估算,可能因项目最终情况而有所调整。",

      loss: "-", // sign for negative numbers if needed
      dash: "—"
    },
    es: {
      brandSub: "Sociedad patrimonial · Álava",
      titleMain: "Operación Murua",
      titleEm: "Cómo funciona tu inversión",
      heroSub: "Aquí tienes, paso a paso, qué pasa con tu dinero y cuánto vuelve.",

      s1num: "01 · La operación, en un párrafo",
      s1h2: "Se compra, se reforma y se vende",
      s1p: "McVeras se ha adjudicado una vivienda en Murua en subasta judicial. La operación es sencilla: <strong>se compra, se hace una reforma ligera y se vende</strong>.",

      s2num: "02 · Lo que se pide y cómo se reparte",
      s2h2: "80.000 € entre los inversores",
      s2p1: "La aportación total pactada es de <strong>80.000 €</strong>, entre los inversores. Estimamos vender la casa por <strong>160.000 €</strong>, aunque podría llegar a 189.000 € si el mercado acompaña. Con esa venta, se recupera todo el dinero puesto y el beneficio que sobra se reparte: <strong>34 % para McVeras</strong>, que gestiona toda la operación, y <strong>66 % para los inversores</strong>, en proporción a lo que haya puesto cada uno.",
      s2p2: "Si en algún momento hiciera falta algo más de dinero del previsto, ese extra lo adelanta <strong>McVeras</strong>, no los inversores. La aportación total de los inversores se queda en los <strong>80.000 €</strong> pactados.",

      s3num: "03 · Qué te llega a ti",
      s3h2: "Muévelo y compruébalo",
      s3p: "Ajusta cuánto pones y a qué precio se vende la casa. Los números se recalculan al momento.",

      apLab: "Tú aportas",
      pLab: "Precio de venta",

      rowPuestoLab: "Recuperas lo que pusiste",
      rowBeneficioLab: "Más tu parte del beneficio",
      rowPctLab: "Rentabilidad bruta",
      rowTotalLab: "Total que te llega",

      flagOkTitle: "Por encima del punto muerto.",
      flagOkText: "Recuperas tu aportación íntegra y cobras tu parte del beneficio.",
      flagWarnTitle: "Por debajo del punto muerto.",
      flagWarnText: function(total, ap){
        return "Recuperarías " + total + " € de los " + ap + " € puestos. La pérdida nunca supera tu aportación.";
      },

      anualLab: "Rentabilidad anualizada, según cuánto tarde en venderse",
      a6Lab: "6 meses", a12Lab: "12 meses", a18Lab: "18 meses",
      anualNote: "Si la venta se cierra antes, la misma ganancia rinde más al año. Si tarda más, rinde menos. El dinero ganado no cambia — cambia cuánto tiempo ha estado trabajando.",

      quoteText: "Tu porcentaje sobre el beneficio sale de cuánto pones: <b>66 % × (tu aportación ÷ 80.000 €)</b>. Si pusieras más o menos, tu porcentaje cambiaría, pero tu rentabilidad por cada euro puesto sería siempre la misma.",

      footerText: "McVeras S.L. · CIF B05393699 · Vitoria-Gasteiz — Documento explicativo. Las cifras son estimaciones y pueden variar según las condiciones finales de la operación.",

      dash: "—"
    }
  };

  var CAP_TOTAL = 80000;
  var COSTE = 82994;
  var COM = 0.03, IVA = 1.21;
  var FIJOS = 500*IVA + 300*IVA + 3000 + 1000;

  var currentLang = 'zh';

  var eur = { format: function(n){
    n = Math.round(n);
    var s = Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return (n < 0 ? '-' : '') + s;
  }};
  var pctFmt = { format: function(n){
    return n.toFixed(1).replace('.', ',');
  }};

  var apSlider = document.getElementById('apSlider');
  var pSlider  = document.getElementById('pSlider');
  var apVal = document.getElementById('apVal');
  var pVal  = document.getElementById('pVal');
  var rowPuesto = document.getElementById('rowPuesto');
  var rowBeneficio = document.getElementById('rowBeneficio');
  var rowPct = document.getElementById('rowPct');
  var rowTotal = document.getElementById('rowTotal');
  var flag = document.getElementById('flag');
  var a6 = document.getElementById('a6');
  var a12 = document.getElementById('a12');
  var a18 = document.getElementById('a18');

  function applyStaticText(L){
    document.getElementById('brandSub').textContent = L.brandSub;
    document.getElementById('titleMain').textContent = L.titleMain;
    document.getElementById('titleEm').textContent = L.titleEm;
    document.getElementById('heroSub').textContent = L.heroSub;

    document.getElementById('s1num').textContent = L.s1num;
    document.getElementById('s1h2').textContent = L.s1h2;
    document.getElementById('s1p').innerHTML = L.s1p;

    document.getElementById('s2num').textContent = L.s2num;
    document.getElementById('s2h2').textContent = L.s2h2;
    document.getElementById('s2p1').innerHTML = L.s2p1;
    document.getElementById('s2p2').innerHTML = L.s2p2;

    document.getElementById('s3num').textContent = L.s3num;
    document.getElementById('s3h2').textContent = L.s3h2;
    document.getElementById('s3p').textContent = L.s3p;

    document.getElementById('apLab').textContent = L.apLab;
    document.getElementById('pLab').textContent = L.pLab;

    document.getElementById('rowPuestoLab').textContent = L.rowPuestoLab;
    document.getElementById('rowBeneficioLab').textContent = L.rowBeneficioLab;
    document.getElementById('rowPctLab').textContent = L.rowPctLab;
    document.getElementById('rowTotalLab').textContent = L.rowTotalLab;

    document.getElementById('anualLab').textContent = L.anualLab;
    document.getElementById('a6Lab').textContent = L.a6Lab;
    document.getElementById('a12Lab').textContent = L.a12Lab;
    document.getElementById('a18Lab').textContent = L.a18Lab;
    document.getElementById('anualNote').textContent = L.anualNote;

    document.getElementById('quoteText').innerHTML = L.quoteText;
    document.getElementById('footerText').textContent = L.footerText;

    document.documentElement.setAttribute('lang', currentLang === 'zh' ? 'zh-CN' : 'es');
    document.documentElement.setAttribute('data-lang', currentLang);
  }

  function calc(){
    var L = LANG[currentLang];
    var ap = Number(apSlider.value);
    var p  = Number(pSlider.value);

    var gastosVenta = p*COM*IVA + FIJOS;
    var beneficioTotal = p - gastosVenta - COSTE;
    var tuParte = 0.66 * (ap / CAP_TOTAL);
    var tuBeneficio = beneficioTotal * tuParte;
    var r = tuBeneficio / ap;
    var total = ap + tuBeneficio;

    apVal.textContent = eur.format(ap) + ' €';
    pVal.textContent  = eur.format(p) + ' €';
    rowPuesto.textContent = eur.format(ap) + ' €';
    rowBeneficio.textContent = (tuBeneficio<0?'-':'') + eur.format(Math.abs(tuBeneficio)) + ' €';
    rowPct.textContent = (r<0?'-':'') + pctFmt.format(Math.abs(r)*100) + ' %';
    rowTotal.textContent = eur.format(Math.max(0,total)) + ' €';

    if (r >= 0){
      flag.className = 'flag';
      flag.innerHTML = '<b>' + L.flagOkTitle + '</b> ' + L.flagOkText;
      a6.textContent  = pctFmt.format((Math.pow(1+r,2)-1)*100) + ' %';
      a12.textContent = pctFmt.format(r*100) + ' %';
      a18.textContent = pctFmt.format((Math.pow(1+r,2/3)-1)*100) + ' %';
    } else {
      flag.className = 'flag warn';
      flag.innerHTML = '<b>' + L.flagWarnTitle + '</b> ' + L.flagWarnText(eur.format(Math.max(0,total)), eur.format(ap));
      a6.textContent = L.dash; a12.textContent = L.dash; a18.textContent = L.dash;
    }
  }

  function setLang(lang){
    currentLang = lang;
    document.getElementById('btnZh').setAttribute('aria-pressed', lang==='zh' ? 'true':'false');
    document.getElementById('btnEs').setAttribute('aria-pressed', lang==='es' ? 'true':'false');
    applyStaticText(LANG[lang]);
    calc();
  }

  document.getElementById('btnZh').addEventListener('click', function(){ setLang('zh'); });
  document.getElementById('btnEs').addEventListener('click', function(){ setLang('es'); });
  apSlider.addEventListener('input', calc);
  pSlider.addEventListener('input', calc);

  setLang('zh');
})();
</script>
</body>
</html>
